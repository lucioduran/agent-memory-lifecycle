[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-lifecycle"
version = "0.1.0"
description = "Auditable temporal memory policies and local retrieval"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
include = ["memory_lifecycle*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
strict = true
[tool.coverage.run]
branch = true
source = ["memory_lifecycle"]
[tool.coverage.report]
show_missing = true
fail_under = 90
